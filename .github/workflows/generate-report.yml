name: Generate Graft report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-report.mjs"
      - "snapshot/ki-usecase-radar/structural/**"
      - "snapshot/ki-usecase-radar/metadata.json"

permissions:
  contents: write

concurrency:
  group: graft-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate report from committed graph
        run: node scripts/generate-report.mjs

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md
          if git diff --cached --quiet; then
            echo "REPORT.md unchanged."
            exit 0
          fi
          git commit -m "docs(report): refresh KI-UseCase-Radar Graft analysis"
          git push origin HEAD:main
